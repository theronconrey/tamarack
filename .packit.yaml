#
# Packit builds the RPM in Copr for every pull request, on every supported
# Fedora release. Active once the Packit GitHub app is installed on the repo:
# https://packit.dev/docs/guide

specfile_path: tamarack.spec
upstream_package_name: tamarack
downstream_package_name: tamarack
upstream_tag_template: v{version}

files_to_sync:
  - tamarack.spec
  - .packit.yaml

jobs:
  - job: copr_build
    trigger: pull_request
    targets:
      - fedora-all

  - job: copr_build
    trigger: commit
    branch: main
    targets:
      - fedora-all

  # The VM test matrix (plans/storage.fmf) on Testing Farm, against the
  # Copr build above: one VM per plan, in parallel. Needs the Packit app,
  # like the builds.
  - job: tests
    trigger: pull_request
    tmt_plan: "^/plans/storage/"
    targets:
      - fedora-latest-stable

  # Measurements (plans/measure.fmf), only when asked for with
  # "/packit test --identifier measure" on a pull request.
  - job: tests
    trigger: pull_request
    identifier: measure
    manual_trigger: true
    tmt_plan: "^/plans/measure$"
    targets:
      - fedora-latest-stable
