<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later

     System bus policy for the Tamarack engine. Installed to
     /usr/share/dbus-1/system.d/. Only root may own the name; anyone may call
     the Tamarack interfaces, because the engine asks polkit to authorize
     every call (docs/design/engine.md, section 4).
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.theronconrey.Tamarack1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.theronconrey.Tamarack1"
           send_interface="io.github.theronconrey.Tamarack1.Manager"/>
    <allow send_destination="io.github.theronconrey.Tamarack1"
           send_interface="io.github.theronconrey.Tamarack1.Plan"/>
    <allow send_destination="io.github.theronconrey.Tamarack1"
           send_interface="io.github.theronconrey.Tamarack1.Job"/>
    <allow send_destination="io.github.theronconrey.Tamarack1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.theronconrey.Tamarack1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.theronconrey.Tamarack1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
