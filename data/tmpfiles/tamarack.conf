#
# Installed to /usr/lib/tmpfiles.d/. The engine keeps its lines in
# /etc/integritytab, and its sandbox lets it write that one file but not
# create it in /etc, so the file has to exist (empty is fine).
f /etc/integritytab 0644 root root -
# The engine writes /etc/nfs.conf.d/tamarack.conf (NFSv4 only) when the first
# share is made; until then it is empty and changes nothing.
d /etc/nfs.conf.d 0755 root root -
f /etc/nfs.conf.d/tamarack.conf 0644 root root -
