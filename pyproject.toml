[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "tamarack-nas"
version = "0.1.0"
description = "Tamarack: Drobo-style mixed-drive storage planner for mdadm, dm-integrity, LVM and Btrfs"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# "test" is what the RPM build installs (%pyproject_buildrequires -x test).
test = ["pytest"]
dev = ["tamarack-nas[test]", "ruff", "mypy"]

[project.scripts]
tamarack = "tamarack.cli:main"
# Moved to /usr/libexec by the RPM: started by systemd, not by people.
tamarack-engine = "tamarack.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The D-Bus interface definition: the engine loads it at runtime.
tamarack = ["*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets a source checkout run tests without installing. The RPM %check
# overrides this to test the installed package.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # keep commented if/else branches readable

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["tamarack"]

[[tool.mypy.overrides]]
# PyGObject ships no type information in Fedora.
module = ["gi", "gi.*"]
ignore_missing_imports = true
