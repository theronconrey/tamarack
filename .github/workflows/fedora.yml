#
# Checks every push and pull request inside Fedora: the code checks, then an
# RPM build from tamarack.spec, rpmlint, and an install of the built package.

name: Fedora

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/${{ matrix.image }}
    continue-on-error: ${{ matrix.image == 'fedora:rawhide' }}
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "fedora:rawhide"]
    steps:
      - name: Install Fedora tooling
        run: >
          dnf -y install glibc-langpack-en git-core rpm-build rpmdevtools rpmlint
          python3-devel pyproject-rpm-macros python3-pytest python3-mypy ruff
          python3-gobject-base dbus-daemon tmt nodejs

      - uses: actions/checkout@v4

      - name: Code checks
        env:
          # The D-Bus tests must run here, not skip.
          TAMARACK_REQUIRE_DBUS_TESTS: "1"
        run: |
          python3 -m pytest -rs
          ruff check .
          ruff format --check .
          mypy
          node --test tests/cockpit/test_status.js
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tmt lint

      - name: Build the RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmdev-setuptree
          version=$(rpmspec -q --srpm --qf '%{version}' tamarack.spec)
          git archive --format=tar.gz --prefix="tamarack-$version/" \
            -o "$HOME/rpmbuild/SOURCES/tamarack-$version.tar.gz" HEAD
          # Static BuildRequires first, then the dynamic ones that
          # %generate_buildrequires produces.
          dnf -y builddep tamarack.spec
          for attempt in 1 2 3; do
            rpmbuild -br tamarack.spec && break
            dnf -y builddep "$HOME"/rpmbuild/SRPMS/tamarack-*.buildreqs.nosrc.rpm
          done
          rpmbuild -ba tamarack.spec

      - name: rpmlint
        run: |
          rpmlint -r tamarack.rpmlintrc tamarack.spec "$HOME"/rpmbuild/SRPMS/tamarack-*.src.rpm \
            "$HOME"/rpmbuild/RPMS/noarch/tamarack-*.rpm

      - name: Install and smoke-test the package
        run: |
          dnf -y install "$HOME"/rpmbuild/RPMS/noarch/tamarack-*.noarch.rpm
          cd /
          tamarack --version
          rpm -ql tamarack | grep -q "/man1/tamarack.1"
          tamarack plan 4TB 4TB 8TB 8TB
          tamarack grow /dev/sda=4TB --add /dev/sdb=4TB
          rpm -q --qf '%{LICENSE}\n' tamarack
          # The engine package: files in place, unit valid, sandbox reported.
          /usr/libexec/tamarack-engine --help
          test ! -e /etc/tamarack/engine.conf  # execution stays off by default
          # --man=no: the container installs without documentation.
          systemd-analyze verify --man=no /usr/lib/systemd/system/tamarack-engine.service
          semodule -l | grep -qx tamarack  # the SELinux module installed
          # The Cockpit page: installed where Cockpit looks, and listed by it.
          cockpit-bridge --packages | grep -qw tamarack
          systemd-analyze security --offline=true --no-pager \
            /usr/lib/systemd/system/tamarack-engine.service || true
